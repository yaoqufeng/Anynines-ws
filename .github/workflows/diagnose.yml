name: diagnose

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Install CF CLI (same binary-tarball method as deploy.yml)
        run: |
          curl -L -o /tmp/cf-cli.tgz "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=v8&source=github"
          tar -xzf /tmp/cf-cli.tgz -C /tmp
          if [ -f /tmp/cf8 ]; then sudo mv /tmp/cf8 /usr/local/bin/cf; else sudo mv /tmp/cf /usr/local/bin/cf; fi
          cf version
      - name: Log in to Cloud Foundry (same parsing and login as deploy.yml)
        env:
          CF_CREDENTIALS: ${{ secrets.CF_CREDENTIALS }}
        run: |
          CF_API="https://api.de.a9s.eu"
          CF_USER="${CF_CREDENTIALS%%-----*}"
          CF_PASS="${CF_CREDENTIALS#*-----}"
          echo "::add-mask::$CF_PASS"
          cf api "$CF_API"
          cf auth "$CF_USER" "$CF_PASS"
          cf target -o admin_gpt_us_kg -s production || true
      - name: Read-only CF diagnostic
        run: |
          set +e
          echo "=== cf target ==="
          cf target || true
          echo "=== cf orgs ==="
          cf orgs || true
          echo "=== cf org admin_gpt_us_kg ==="
          cf org admin_gpt_us_kg || true
          echo "=== cf spaces ==="
          cf spaces || true
          echo "=== cf space production ==="
          SPACE_OUT=$(cf space production 2>&1 || true)
          echo "$SPACE_OUT"
          echo "=== cf quotas ==="
          cf quotas || true
          echo "=== cf org-users admin_gpt_us_kg ==="
          cf org-users admin_gpt_us_kg || true
          echo "=== cf space-users admin_gpt_us_kg production ==="
          cf space-users admin_gpt_us_kg production || true
          echo "=== cf apps ==="
          cf apps || true
          echo "=== cf services ==="
          cf services || true
          echo "=== cf quota (from cf space production) ==="
          QUOTA_NAME=$(echo "$SPACE_OUT" | grep -i quota | head -n 1 | sed -E 's/.*[Qq]uota[^A-Za-z0-9_.-]*//; s/[^A-Za-z0-9_.-].*//')
          if [ -n "$QUOTA_NAME" ]; then
            echo "Quota name parsed: $QUOTA_NAME"
            cf quota "$QUOTA_NAME" || true
          else
            echo "No quota name parsed from cf space production output"
          fi
          echo "=== diagnostic done (read-only; no cf push, no create/delete/modify) ==="
